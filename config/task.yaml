market_research:
  description: >
    Conduct comprehensive market research to identify trends, opportunities, and challenges in the industry. 
    Focus on understanding competitors, audience behavior, and product positioning.

    <Product Name>{product_name}</Product Name>
    <Product Description>{product_description}</Product Description>
    <Target Audience>{target_audience}</Target Audience>
    <Budget>{budget}</Budget>
    Current date: {current_date}

    IMPORTANT: After completing your research, you MUST return a valid JSON object with ALL required fields.
    Do NOT just save a file and return the filename. You must return the actual structured data.

  expected_output: >
    YOU MUST return ONLY a valid JSON object with these EXACT fields (no additional fields, no missing fields):
    
    {{
      "market_trends": [
        "AI integration in business tools is accelerating",
        "Small businesses seeking automation solutions",
        "Growing demand for no-code/low-code tools"
      ],
      "competitor_analysis": {{
        "Competitor1": "Analysis of their strengths and weaknesses",
        "Competitor2": "Analysis of their market position"
      }},
      "customer_insights": {{
        "pain_points": "Manual Excel tasks are time-consuming",
        "preferences": "Easy-to-use interfaces with minimal learning curve",
        "buying_behavior": "Prefer subscription models with trial periods"
      }},
      "recommendations": [
        "Focus on ease of use in marketing messaging",
        "Highlight time-saving benefits",
        "Offer free trial to reduce barrier to entry"
      ],
      "file_path": "resources/research/market_research_report.md"
    }}

    Save your detailed research report to the file_path location, but your final output MUST be the JSON structure above with real data, not just a file reference.

  guidelines: >
    1. Conduct thorough research using available tools
    2. Save a detailed markdown report to 'resources/research/market_research_report.md'
    3. Extract key insights from your research
    4. Return the JSON object with ALL five required fields populated with actual data
    5. Ensure all fields match the exact structure shown in expected_output



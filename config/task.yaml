      "social_media_posts": {
        "LinkedIn": "Draft content...",
        "Instagram": "Draft content..."
      },
      "email_campaigns": {
        "Welcome Email": "Draft content...",
        "Promo Email": "Draft content..."
      },
      "drafts_file_path": "resources/drafts/posts/draft_posts.json"
    }
  guidelines: >
    Save drafts in 'resources/drafts/posts/draft_posts.json'. Return JSON.



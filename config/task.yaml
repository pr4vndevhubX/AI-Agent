market_research:
  description: >
    Conduct market research to identify trends, opportunities, and challenges in the industry. 
    Focus on understanding competitors, audience behavior, and product positioning.

    <Product Name>{product_name}</Product Name>
    <Product Description>{product_description}</Product Description>
    <Target Audience>{target_audience}</Target Audience>
    <Budget>{budget}</Budget>
    Current date: {current_date}

  expected_output: >
    Return JSON exactly matching MarketResearchOutput:
    {
      "market_trends": ["trend1", "trend2", "trend3"],
      "competitor_analysis": {"competitor_name": "analysis"},
      "customer_insights": {"insight": "details"},
      "recommendations": ["recommendation1", "recommendation2"],
      "file_path": "resources/research/market_research_report.md"
    }
  guidelines: >
    Save the market research report in 'resources/research/market_research_report.md'. 
    Return JSON with all fields as shown above.

marketing_strategy:
  description: >
    Develop a marketing strategy aligned with the company's goals using insights from market research.

    <Product Name>{product_name}</Product Name>
    <Product Description>{product_description}</Product Description>
    <Target Audience>{target_audience}</Target Audience>
    Current date: {current_date}

  expected_output: >
    Return JSON exactly matching MarketingStrategyOutput:
    {
      "target_audience_segments": ["segment1", "segment2"],
      "marketing_channels": ["LinkedIn", "Email", "Instagram"],
      "weekly_plan": {
        "Monday": ["Post Blog", "Instagram Reel"],
        "Tuesday": ["Email Campaign"],
        "Wednesday": ["Social Media Post"]
      },
      "budget_allocation": 50000.0,
      "kpis": {"Engagement": "10%", "Leads": "50"},
      "file_path": "resources/research/marketing_strategy.json"
    }
  guidelines: >
    Save the strategy in the given file path. Return JSON as above.


content_calendar:
  description: >
    Create a weekly content calendar aligned with the marketing strategy.

    <Product Name>{product_name}</Product Name>
    <Product Description>{product_description}</Product Description>
    <Target Audience>{target_audience}</Target Audience>
    Current date: {current_date}

  expected_output: >
    Return JSON matching ContentCalendarOutput:
    {
      "topics_formats": {"Blog": "AI Automation", "Reel": "Quick Tips"},
      "publishing_schedule": {"Monday": "Blog", "Tuesday": "Reel"},
      "key_campaigns": ["Launch Campaign", "Tutorial Series"],
      "calendar_file_path": "resources/drafts/content_calendar.md"
    }
  guidelines: >
    Save calendar in 'resources/drafts/content_calendar.md'. Return JSON as above.



script_reels_shorts:
  description: >
    Write engaging scripts for short-form video content (Instagram Reels, YouTube Shorts, TikTok).
    Scripts should be concise, attention-grabbing, and showcase product benefits quickly.

    <Product Name>{product_name}</Product Name>
    <Product Description>{product_description}</Product Description>
    <Target Audience>{target_audience}</Target Audience>
    Current date: {current_date}

    Each script should be 30-60 seconds long with clear hooks and calls-to-action.

  expected_output: >
    YOU MUST return ONLY a valid JSON object with these EXACT fields:
    
    {{
      "scripts": {{
        "Instagram Reel 1": "[0-3s] HOOK: 'Spending hours on Excel reports?'\n[4-8s] Show problem: Manual data entry pain\n[9-15s] Introduce solution: Our AI tool\n[16-25s] Show transformation: Automated workflow\n[26-30s] CTA: 'Try free at [link]' + product logo",
        "YouTube Short 1": "[0-3s] HOOK: 'This AI tool just saved me 10 hours'\n[4-10s] Demo: Upload Excel file\n[11-20s] Show: AI processing and automation\n[21-30s] Results: Completed report\n[31-35s] CTA: 'Link in description'",
        "Instagram Reel 2": "[0-3s] HOOK: 'SMEs waste 15 hours weekly on Excel'\n[4-8s] Stats about time waste\n[9-15s] Our solution: AI automation\n[16-25s] Key features showcase\n[26-30s] CTA: 'Free trial - link in bio'",
        "TikTok 1": "[0-2s] HOOK: 'Excel hack for small businesses'\n[3-8s] Show before: Manual process\n[9-15s] Show after: AI automation\n[16-25s] User testimonial\n[26-30s] CTA: 'Check link in bio'"
      }},
      "file_path": "resources/drafts/reels/scripts.json"
    }}

    Save detailed scripts to the file path, then return the JSON above with actual video scripts.

  guidelines: >
    1. Start with attention-grabbing hooks (first 3 seconds critical)
    2. Show problem-solution-benefit structure
    3. Include visual cues and text overlay suggestions
    4. Keep language simple and energetic
    5. End with clear CTAs
    6. Save all scripts to 'resources/drafts/reels/scripts.json'
    7. Return complete JSON with both required fields


